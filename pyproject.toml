[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "yue2-particle-sliders"
version = "0.3.0"
description = "YuE2 native AR hidden-response particle slider lifecycle (integration draft)"
readme = "LIFECYCLE.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
# Current lifecycle sources and exact official PG release are verified at runtime.
# Historical CDF and PG091 reproduction locks remain separate.
dependencies = ["particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@ddb41423bcefc1fe76cd94d0f9b367353b3ea137#subdirectory=packages/particle-sliders-core", "torch>=2.6,<3", "PyYAML>=6", "safetensors>=0.4", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["yue2_sliders", "yue2_sliders._assets"]

[tool.setuptools.package-dir]
"yue2_sliders._assets" = "configs/yue2"

[tool.setuptools.package-data]
yue2_sliders = ["lifecycle-runtime.lock.json"]
"yue2_sliders._assets" = ["*.json", "*.yaml", "catalog/*.yaml"]

[project.entry-points."particle_sliders.response_backends"]
yue2 = "yue2_sliders.lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
yue2 = "yue2_sliders.response_native:INFERENCE"
